<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Subtitle Parser</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>YouTube 字幕解析器</h1>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">单词:</span>
          <span class="stat-value" id="total-words">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">出现次数:</span>
          <span class="stat-value" id="total-occurrences">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">视频:</span>
          <span class="stat-value" id="total-videos">0</span>
        </div>
      </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input
        type="text"
        id="search-input"
        placeholder="搜索单词..."
        autocomplete="off"
      />
      <button id="clear-search" class="icon-btn" title="清除搜索">×</button>
    </div>

    <!-- 排序和过滤 -->
    <div class="controls">
      <select id="sort-select">
        <option value="frequency">按频率排序</option>
        <option value="alphabetical">按字母排序</option>
        <option value="recent">按最近使用</option>
      </select>
      <button id="refresh-btn" class="btn-secondary">刷新</button>
      <button id="clear-all-btn" class="btn-danger">清空数据</button>
    </div>

    <!-- 单词列表 -->
    <div class="word-list" id="word-list">
      <div class="loading">加载中...</div>
    </div>

    <!-- 单词详情弹窗 -->
    <div class="modal" id="word-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-word"></h2>
          <button class="close-btn" id="close-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="word-stats">
            <span>出现次数: <strong id="modal-count"></strong></span>
            <span>视频数: <strong id="modal-video-count"></strong></span>
          </div>
          <div class="occurrences-list" id="occurrences-list">
            <!-- 动态填充 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../utils/db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
